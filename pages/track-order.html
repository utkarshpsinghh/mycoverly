<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Coverly</title><link rel="stylesheet" href="page.css"></head><body><div class="bar">ORDER TRACKING</div><nav class="nav"><a class="logo" href="../index.html">COVER<i>LY</i></a><div class="nav-links"><a href="../index.html#shop">Shop</a><a href="contact.html">Contact</a></div></nav><main class="wrap"><p class="kicker">Track order</p><h1>Where is my order?</h1><p class="intro">Enter both details from your order confirmation to view its status.</p><form class="card" id="track"><label>Order ID<input name="id" required placeholder="CVR-XXXXXX"></label><label>Mobile number<input name="phone" required inputmode="numeric" placeholder="10-digit mobile number"></label><button class="bag">TRACK ORDER</button></form><div id="result" class="content"></div></main><footer class="footer"><a class="logo" href="../index.html">COVER<i>LY</i></a><p><a href="faq.html">FAQ</a> · <a href="contact.html">Contact</a></p></footer><script>track.onsubmit=e=>{e.preventDefault();let d=new FormData(track),o=(JSON.parse(localStorage.getItem('coverlyOrders')||'[]')).find(x=>x.orderId.toLowerCase()===d.get('id').trim().toLowerCase()&&x.phone===d.get('phone').replace(/\D/g,''));result.innerHTML=o?`<h2>${o.orderId}</h2><p><b>${o.orderStatus}</b> · ${o.paymentStatus}</p><p>Order Placed → Payment Verification → Confirmed → Preparing → Shipped → Out for Delivery → Delivered</p>`:'<p>We couldn’t find an order matching both details. Please check them or contact support.</p>'}</script></body></html>
