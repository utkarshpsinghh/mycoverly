<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Coverly</title><link rel="stylesheet" href="page.css"><style>.production-track{display:grid;gap:0;margin-top:22px}.production-track div{position:relative;padding:0 0 20px 30px;font-size:12px;color:#738078}.production-track div:before{content:'';position:absolute;left:7px;top:2px;width:12px;height:12px;border-radius:50%;background:#dfe6dd}.production-track div:after{content:'';position:absolute;left:12px;top:14px;width:2px;height:100%;background:#dfe6dd}.production-track div:last-child:after{display:none}.production-track .active{color:#17261f;font-weight:800}.production-track .active:before{background:#d7ff64;box-shadow:0 0 0 4px #eaf6c6}</style></head><body><div class="bar">ORDER TRACKING</div><nav class="nav"><a class="logo" href="../index.html">COVER<i>LY</i></a><div class="nav-links"><a href="../index.html#shop">Shop</a><a href="contact.html">Contact</a></div></nav><main class="wrap"><p class="kicker">Track order</p><h1>Where is my order?</h1><p class="intro">Enter both details from your order confirmation to view its status.</p><form class="card" id="track"><label>Order ID<input name="id" required placeholder="CVR-XXXXXX"></label><label>Mobile number<input name="phone" required inputmode="numeric" placeholder="10-digit mobile number"></label><button class="bag">TRACK ORDER</button></form><div id="result" class="content"></div></main><footer class="footer"><a class="logo" href="../index.html">COVER<i>LY</i></a><p><a href="faq.html">FAQ</a> · <a href="contact.html">Contact</a></p></footer><script>track.onsubmit=e=>{e.preventDefault();let d=new FormData(track),o=(JSON.parse(localStorage.getItem('coverlyOrders')||'[]')).find(x=>x.orderId.toLowerCase()===d.get('id').trim().toLowerCase()&&x.phone===d.get('phone').replace(/\D/g,'')),steps=['Order Placed','Payment Verified','Design Review','Design Preparation','Case Production','Quality Check','Shipped','Out for Delivery','Delivered'],active=o?Math.max(0,steps.findIndex(x=>x.toLowerCase()===String(o.orderStatus).toLowerCase())):-1;result.innerHTML=o?`<h2>${o.orderId}</h2><p><b>${o.orderStatus}</b> · ${o.paymentStatus}</p><div class="production-track">${steps.map((step,i)=>`<div class="${i<=active?'active':''}">${step}</div>`).join('')}</div>`:'<p>We couldn’t find an order matching both details. Please check them or contact support.</p>'}</script></body></html>
