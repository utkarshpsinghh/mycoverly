<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Coverly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="checkout.css"><script src="config.js" defer></script><script src="google-sheets-config.js" defer></script><script src="checkout.js" defer></script></head><body><div class="announcement">SECURE UPI CHECKOUT · PAYMENT VERIFICATION IS MANUAL</div><header class="header"><a class="logo" href="index.html">COVER<span>LY</span></a><a href="index.html" class="cart-toggle">Continue shopping</a></header><main class="checkout-page"><section><p class="eyebrow">Checkout</p><h1>Delivery details</h1><form id="checkoutForm"><fieldset><legend>CONTACT INFORMATION</legend><label>Full name *<input name="name" required autocomplete="name"></label><label>Mobile number *<input name="phone" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit mobile number" autocomplete="tel"></label><label>Email <input name="email" type="email" autocomplete="email"></label></fieldset><fieldset><legend>DELIVERY ADDRESS</legend><label>House / Flat / Building *<input name="address" required autocomplete="address-line1"></label><label>Area / Street *<input name="area" required autocomplete="address-line2"></label><div class="two"><label>City *<input name="city" required autocomplete="address-level2"></label><label>State *<input name="state" required autocomplete="address-level1"></label></div><label>PIN code *<input name="pincode" required inputmode="numeric" pattern="[0-9]{6}" autocomplete="postal-code"></label></fieldset><fieldset><legend>PAYMENT METHOD</legend><label class="pay-option"><input type="radio" name="method" value="prepaid" checked><span><b>Prepaid UPI — 10% OFF</b><small>Pay the discounted total now.</small></span></label><label class="pay-option"><input type="radio" name="method" value="cod"><span><b>COD — ₹199 advance</b><small>The advance is part of your order total; the rest is due on delivery.</small></span></label></fieldset><button class="button" type="submit">CONTINUE TO PAYMENT</button></form></section><aside class="order-card"><h2>Your order</h2><div id="orderItems"></div><div id="calculation"></div></aside></main><dialog id="paymentDialog"><button class="close-dialog" onclick="paymentDialog.close()">×</button><div id="paymentContent"></div></dialog></body></html>
