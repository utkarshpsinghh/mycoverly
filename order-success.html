<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order placed — Coverly</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="checkout.css"></head><body><header class="header"><a class="logo" href="index.html">COVER<span>LY</span></a></header><main class="checkout-page"><section id="success"></section></main><script>let o=JSON.parse(localStorage.getItem('coverlyLastOrder')||'null');if(!o)location.href='index.html';else success.innerHTML=`<p class="eyebrow">Order confirmed</p><h1>Order placed successfully!</h1><p><b>Order ID: ${o.orderId}</b></p><p>${o.paymentMethod==='COD'?'Your ₹199 advance payment is awaiting verification.':'Your payment is awaiting verification.'}</p><div class="order-card"><p>Order total <b>₹${o.total}</b></p><p>Amount paid <b>₹${o.amountPaid}</b></p>${o.amountRemaining?`<p>Remaining on delivery <b>₹${o.amountRemaining}</b></p>`:''}<p>${o.customerName} · ${o.city}</p><p>${o.items.map(i=>i.model+' '+i.type+' × '+i.quantity).join('<br>')}</p></div><p>We’ll contact you if we need anything else.</p><a class="button" href="pages/track-order.html">TRACK ORDER</a> <a class="button" style="border:1px solid var(--line);background:white;color:var(--ink)" href="index.html">CONTINUE SHOPPING</a>`;</script></body></html>
